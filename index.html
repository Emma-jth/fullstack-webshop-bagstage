<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vintage Bags</title>
</head>

<body>

    <!-- Main navigation -->
    <header>
        <nav>

            <!-- Menu button -->
            <button type="button" aria-label="Open menu">
                ☰
            </button>

            <!-- Logo -->
            <a href="/" class="logo">
                Bagstage
            </a>

            <!-- Search field -->
            <form class="search">
                <label for="search">Search</label>
                <div class="search-box">
                <input
                    type="search"
                    id="search"
                    placeholder="What are you looking for?"
                >
                <button type="submit" aria-label="Search">
                  →
               </button>
               </div>
                
            </form>

            <!-- Icons -->
            <div class="actions">
                <button type="button" aria-label="Favorites">
                    ♡
                </button>

                <button type="button" aria-label="Profile">
                    ♙
                </button>

                <button type="button" aria-label="Shopping cart">
                    🛒
                </button>
            </div>

        </nav>
    </header>

    <nav class="categories" aria-label="Bag categories">
        <a href="#">All Bags</a>
        <a href="#">Clutches</a>
        <a href="#">Handbag</a>
        <a href="#">Shopper</a>
        <a href="#">Backpack</a>
    
     </nav>

    <section class="hero">
        <img src="images/bagstage-hero.png" alt="Bagstage vintage bags collection">
    </section>

    <section class="brands">
        <h2>Discover Brands</h2>
        <div class="heading-line"></div>

        <div class="brand-list">
            <a href="#" class="brand">
        <img src="images/bagstage-chanel.webp" alt=""Chanel">
        <h3>Chanel</h3>
    </a>
    <a href="#" class="brand">
        <img src="images/louis-vuitton.jpg" alt=""Chanel">
        <h3>Louis Vuitton</h3>
    </a>
    <a href="#" class="brand">
        <img src="images/Gucci.jpg" alt=""Chanel">
        <h3>Gucci</h3>
    </a>
    <a href="#" class="brand">
        <img src="images/bagstage-dior.png" alt=""Chanel">
        <h3>Dior</h3>
    </a>
    <a href="#" class="brand">
        <img src="images/hermes.jpg" alt=""Chanel">
        <h3>Hermés</h3>
    </a>
</div>
</section>





   <main>

   </main>

</body>
</html>
